<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Pedido FINZA Premium</title>
<style>
:root{--bg:#eef6f6;--card:rgba(255,255,255,.85);--text:#0f172a;--muted:#64748b;--line:rgba(15,23,42,.1);--teal:#0f766e;--teal2:#14b8a6}
@media (prefers-color-scheme:dark){:root{--bg:#0b1220;--card:rgba(30,41,59,.85);--text:#e2e8f0;--muted:#94a3b8;--line:rgba(148,163,184,.2);--teal:#2dd4bf;--teal2:#14b8a6}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;font:16px/1.5 system-ui,"Segoe UI",Roboto,sans-serif;color:var(--text);
background:radial-gradient(700px 400px at 0 0,rgba(20,184,166,.25),transparent 60%),radial-gradient(700px 400px at 100% 100%,rgba(99,102,241,.2),transparent 60%),var(--bg)}
.card{width:100%;max-width:440px;background:var(--card);border:1px solid var(--line);border-radius:26px;padding:26px 20px;text-align:center;box-shadow:0 14px 40px rgba(15,23,42,.12)}
.logo{width:64px;height:64px;margin:0 auto 10px;border-radius:18px;display:grid;place-items:center;font-weight:900;font-size:30px;color:#fff;background:linear-gradient(135deg,#0f766e,#6366f1)}
h1{font-size:21px;margin:6px 0}p{color:var(--muted);margin:8px 0}
.btn{display:block;width:100%;padding:14px;border-radius:16px;border:0;font:inherit;font-weight:750;cursor:pointer;text-decoration:none;margin-top:12px}
.primary{background:linear-gradient(135deg,var(--teal),var(--teal2));color:#fff}.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.data{font-family:ui-monospace,Consolas,monospace;font-size:14px;text-align:left;padding:12px;border-radius:12px;border:1px dashed var(--teal);margin-top:14px;white-space:pre-line}
</style>
</head>
<body>
<main class="card">
  <div class="logo">F</div>
  <h1>Pedido de FINZA Premium</h1>
  <div id="ok" hidden>
    <p>Esta página es para el equipo FINZA: abre la ficha del pedido en FINZA Admin.</p>
    <a class="btn primary" id="open" href="#">Abrir en FINZA Admin</a>
    <button class="btn ghost" id="copy" type="button">Copiar datos</button>
    <div class="data" id="data"></div>
    <p style="font-size:13px">Si pediste Premium, no tienes que hacer nada más: te responderemos con tu código.</p>
  </div>
  <p id="bad" hidden>Este enlace no trae un pedido válido.</p>
</main>
<script>
(function(){
  var h=location.hash.replace(/^#/,""),p={};
  h.split("&").forEach(function(kv){var i=kv.indexOf("=");if(i>0)p[kv.slice(0,i)]=decodeURIComponent(kv.slice(i+1));});
  var id=p.id||"",v=p.v||"";
  if(!/^FZ-?[A-Z0-9]{4}-?[A-Z0-9]{4}$/i.test(id)){document.getElementById("bad").hidden=false;return;}
  if(!/^[0-9A-Za-z.\-]{0,30}$/.test(v))v="";
  document.getElementById("ok").hidden=false;
  var text="ID de instalación: "+id+"\nVersión de FINZA: "+(v||"—");
  document.getElementById("data").textContent=text;
  var href="finzaadmin://abrir?id="+encodeURIComponent(id)+"&v="+encodeURIComponent(v);
  document.getElementById("open").href=href;
  document.getElementById("copy").onclick=function(){
    var b=document.getElementById("copy");
    if(navigator.clipboard)navigator.clipboard.writeText(text).then(function(){b.textContent="✓ Datos copiados";});
  };
  if(!/Android|iPhone|iPad/i.test(navigator.userAgent))setTimeout(function(){location.href=href;},500);
})();
</script>
</body>
</html>
